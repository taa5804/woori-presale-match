<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c52">
<title>우리 아파트 분양 | 프리미엄 분양 카탈로그</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
  color: #0f172a;
}
.sale-main {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: 16px 14px 60px;
}
.main-head {
  padding: 24px 20px;
  background: linear-gradient(135deg, #0b2238 0%, #133c56 100%);
  border-radius: 18px;
  color: #fff;
  box-shadow: 0 10px 25px rgba(11,34,56,0.15);
}
.eyebrow {
  display: inline-block;
  margin-bottom: 8px;
  padding: 5px 12px;
  border-radius: 20px;
  background: rgba(214,178,110,0.18);
  border: 1px solid rgba(214,178,110,0.45);
  color: #f3d999;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.5px;
}
.main-head h1 {
  margin: 0 0 6px;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.main-head p {
  margin: 0;
  font-size: 13.5px;
  color: #cbd5e1;
  line-height: 1.5;
}

/* 지역 선택 필터 칩 */
.filter-box {
  display: flex;
  gap: 8px;
  margin: 16px 0;
  padding: 12px;
  background: #fff;
  border-radius: 14px;
  border: 1px solid #e2e8f0;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-box::-webkit-scrollbar { display: none; }
.filter {
  flex: none;
  padding: 8px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  background: #f8fafc;
  color: #475569;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.filter.active {
  background: #0f2d44;
  border-color: #0f2d44;
  color: #f3d999;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(15,45,68,0.25);
}

/* 단지 카드 목록 */
.project-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.project-card {
  background: #fff;
  border-radius: 18px;
  border: 1px solid #e2e8f0;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}
.project-image {
  position: relative;
  height: 240px;
  background: #0b1f33 center/cover no-repeat;
  color: #fff;
}
.image-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(7,24,42,0.2) 0%, rgba(7,24,42,0.85) 100%);
}
.card-top {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2;
}
.status {
  padding: 5px 11px;
  border-radius: 20px;
  background: linear-gradient(135deg, #d6b26e, #b88e44);
  color: #081726;
  font-size: 11.5px;
  font-weight: 800;
}
.brand-tag {
  padding: 5px 11px;
  border-radius: 20px;
  background: rgba(11,31,51,0.75);
  border: 1px solid rgba(214,178,110,0.5);
  color: #f3d999;
  font-size: 11.5px;
  font-weight: 700;
  backdrop-filter: blur(4px);
}
.project-title {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 16px;
  z-index: 2;
}
.project-title small {
  color: #f3d999;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  display: block;
  margin-bottom: 4px;
}
.project-title h2 {
  margin: 0 0 4px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.3;
}
.project-title p {
  margin: 0;
  font-size: 13px;
  color: #e2e8f0;
}

.project-info {
  padding: 16px;
}
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.info-grid div {
  padding: 10px 12px;
  background: #f8fafc;
  border: 1px solid #edf2f7;
  border-radius: 10px;
}
.info-grid span {
  display: block;
  font-size: 11.5px;
  color: #64748b;
  margin-bottom: 2px;
}
.info-grid strong {
  font-size: 14px;
  color: #0f172a;
}
.mh-bar {
  padding: 10px 12px;
  background: #f1f5f9;
  border-radius: 10px;
  font-size: 12.5px;
  color: #334155;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mh-bar b {
  color: #0f2d44;
  flex-shrink: 0;
}

/* 원클릭 상세페이지 이동 버튼 */
.detail-btn {
  display: block;
  width: 100%;
  padding: 15px 0;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #0b2238 0%, #164363 100%);
  color: #f3d999;
  font-size: 15px;
  font-weight: 800;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(11,34,56,0.2);
  transition: transform 0.15s, opacity 0.15s;
}
.detail-btn:active {
  transform: scale(0.98);
}
</style>
</head>
<body>

<div class="sale-main" id="saleMain">

  <header class="main-head">
    <span class="eyebrow">PREMIUM RESIDENCE</span>
    <h1>우리 아파트 분양</h1>
    <p>전국 주요 분양 및 분양예정 단지의 핵심 e-카탈로그를 확인하세요.</p>
  </header>

  <nav class="filter-box" id="filterBox">
    <button type="button" class="filter active" data-sido="전체">전체 (148)</button>
    <button type="button" class="filter" data-sido="경기도">경기도</button>
    <button type="button" class="filter" data-sido="부산광역시">부산광역시</button>
    <button type="button" class="filter" data-sido="서울특별시">서울특별시</button>
    <button type="button" class="filter" data-sido="인천광역시">인천광역시</button>
    <button type="button" class="filter" data-sido="충청남도">충청남도</button>
    <button type="button" class="filter" data-sido="경상남도">경상남도</button>
    <button type="button" class="filter" data-sido="전남광주통합특별시">광주·전남</button>
    <button type="button" class="filter" data-sido="울산광역시">울산광역시</button>
    <button type="button" class="filter" data-sido="대구광역시">대구광역시</button>
  </nav>

  <section class="project-list" id="projectList"></section>

</div>

<script>
(function() {
  var presaleData = [];
  var activeSido = "전체";

  // 기본 단지 리스트 (DB 로드 실패 시에도 100% 작동 보장)
  var fallbackData = [
    {
      id: "PS-001",
      sido: "경상남도",
      gugun: "양산시",
      dong: "물금읍",
      apt_name: "양산 호반써밋 프리미엄",
      status: "분양중",
      units: "1,200세대",
      builder: "호반건설",
      address: "경상남도 양산시 물금읍 야리2길",
      director_phone: "010-3990-7887"
    },
    {
      id: "PS-002",
      sido: "서울특별시",
      gugun: "영등포구",
      dong: "신길동",
      apt_name: "더샵 신길센트럴시티",
      status: "분양중",
      units: "67세대 (잔여세대)",
      builder: "(주) 포스코이앤씨",
      address: "서울특별시 영등포구 신길동 413-8",
      director_phone: "010-7674-1117"
    },
    {
      id: "PS-003",
      sido: "경기도",
      gugun: "성남시",
      dong: "분당구",
      apt_name: "판교 레이크뷰 프레스티지",
      status: "분양중",
      units: "1,180세대",
      builder: "대우건설",
      address: "경기도 성남시 분당구 판교역로 일원",
      director_phone: "010-5289-7500"
    },
    {
      id: "PS-004",
      sido: "부산광역시",
      gugun: "해운대구",
      dong: "우동",
      apt_name: "해운대 오션자이",
      status: "분양예정",
      units: "890세대",
      builder: "GS건설(주)",
      address: "부산광역시 해운대구 우동 일원",
      director_phone: "010-4949-3321"
    }
  ];

  function renderList() {
    var container = document.getElementById("projectList");
    if (!container) return;

    var list = presaleData.length > 0 ? presaleData : fallbackData;
    if (activeSido !== "전체") {
      list = list.filter(function(item) {
        return (item.sido || "").indexOf(activeSido) !== -1 || (activeSido === "광주·전남" && (item.sido.indexOf("광주") !== -1 || item.sido.indexOf("전남") !== -1));
      });
    }

    container.innerHTML = list.map(function(item) {
      var aptTitle = item.apt_name || "프리미엄 분양 단지";
      var statusBadge = item.status || "분양중";
      var builder = item.builder || "공식 시공사";
      var locationStr = item.address || ((item.sido || "") + " " + (item.gugun || ""));
      var households = item.units || "대단지";
      
      // 누르면 100% 열리는 직접 링크 주소
      var detailHref = "sale-detail.html?apt=" + encodeURIComponent(aptTitle) + "&sido=" + encodeURIComponent(item.sido || "") + "&phone=" + encodeURIComponent(item.director_phone || "");

      return `
        <article class="project-card">
          <div class="project-image" style="background-image:url('sample-cover.jpg');">
            <div class="image-shade"></div>
            <div class="card-top">
              <span class="status">${statusBadge}</span>
              <span class="brand-tag">${builder}</span>
            </div>
            <div class="project-title">
              <small>${item.sido || ''} ${item.gugun || ''}</small>
              <h2>${aptTitle}</h2>
              <p>최고의 입지와 브랜드 프리미엄을 갖춘 랜드마크</p>
            </div>
          </div>
          <div class="project-info">
            <div class="info-grid">
              <div>
                <span>공급 규모</span>
                <strong>${households}</strong>
              </div>
              <div>
                <span>시공/분양사</span>
                <strong>${builder}</strong>
              </div>
            </div>
            <div class="mh-bar">
              <b>현장 위치</b>
              <span>${locationStr}</span>
            </div>
            <a href="${detailHref}" class="detail-btn">
              📖 분양 카탈로그 보기 (01~08P)
            </a>
          </div>
        </article>
      `;
    }).join("");
  }

  // DB 가져오기
  fetch("presale_db.json")
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (Array.isArray(data) && data.length > 0) {
        presaleData = data;
        renderList();
      }
    })
    .catch(function() {
      presaleData = fallbackData;
      renderList();
    });

  // 지역 필터 클릭 이벤트
  var filterBox = document.getElementById("filterBox");
  if (filterBox) {
    filterBox.addEventListener("click", function(e) {
      if (e.target && e.target.classList.contains("filter")) {
        var buttons = filterBox.querySelectorAll(".filter");
        buttons.forEach(function(b) { b.classList.remove("active"); });
        e.target.classList.add("active");
        activeSido = e.target.getAttribute("data-sido") || "전체";
        renderList();
      }
    });
  }

  renderList();
})();
</script>

</body>
</html>
