<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2238">
<title>우리 아파트 분양 매칭기 | 실시간 맞춤 분양</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
  color: #0f172a;
}
.matcher-container {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: 16px 14px 60px;
}

/* 상단 헤더 */
.matcher-header {
  padding: 24px 20px;
  background: linear-gradient(135deg, #0b2238 0%, #173d59 100%);
  border-radius: 18px;
  color: #fff;
  box-shadow: 0 10px 25px rgba(11,34,56,0.15);
  text-align: center;
}
.eyebrow {
  display: inline-block;
  margin-bottom: 8px;
  padding: 5px 13px;
  border-radius: 20px;
  background: rgba(214,178,110,0.2);
  border: 1px solid rgba(214,178,110,0.5);
  color: #f3d999;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
}
.matcher-header h1 {
  margin: 0 0 6px;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.matcher-header p {
  margin: 0;
  font-size: 13.5px;
  color: #cbd5e1;
  line-height: 1.5;
}

/* 3단계 지역 선택 박스 */
.selector-card {
  margin: 16px 0;
  padding: 16px 14px;
  background: #fff;
  border-radius: 16px;
  border: 1px solid #cbd5e1;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.selector-title {
  font-size: 13px;
  font-weight: 800;
  color: #0f2d44;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.select-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.select-box {
  width: 100%;
  padding: 11px 8px;
  border: 1.5px solid #cbd5e1;
  border-radius: 10px;
  background: #f8fafc;
  font-size: 13.5px;
  font-weight: 700;
  color: #1e293b;
  outline: none;
  cursor: pointer;
  transition: all 0.2s;
}
.select-box:focus {
  border-color: #0f2d44;
  background: #fff;
}

/* 매칭 결과 리스트 바 */
.result-badge-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 20px 4px 10px;
}
.result-badge {
  font-size: 13px;
  font-weight: 800;
  color: #0284c7;
  background: #e0f2fe;
  padding: 5px 12px;
  border-radius: 20px;
}
.result-count {
  font-size: 12.5px;
  color: #475569;
  font-weight: 800;
}

/* 전체 단지 카드 리스트 */
.matched-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.matched-card {
  background: #fff;
  border-radius: 18px;
  border: 1px solid #cbd5e1;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
}

.card-hero {
  position: relative;
  height: 230px;
  background: #0b2238 center/cover no-repeat;
  color: #fff;
}
.hero-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(7,24,42,0.15) 0%, rgba(7,24,42,0.85) 100%);
}
.card-top-badges {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2;
}
.badge-status {
  padding: 5px 12px;
  border-radius: 20px;
  background: linear-gradient(135deg, #d6b26e, #b88e44);
  color: #071726;
  font-size: 11.5px;
  font-weight: 900;
}
.badge-builder {
  padding: 5px 12px;
  border-radius: 20px;
  background: rgba(11,31,51,0.85);
  border: 1px solid rgba(214,178,110,0.5);
  color: #f3d999;
  font-size: 11.5px;
  font-weight: 700;
  backdrop-filter: blur(4px);
}
.card-hero-body {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 16px;
  z-index: 2;
}
.card-hero-body small {
  color: #f3d999;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  display: block;
  margin-bottom: 4px;
}
.card-hero-body h2 {
  margin: 0 0 4px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.3;
}
.card-hero-body p {
  margin: 0;
  font-size: 12.5px;
  color: #e2e8f0;
}

.card-details {
  padding: 16px;
}
.info-table {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.info-cell {
  padding: 10px 12px;
  background: #f8fafc;
  border: 1px solid #edf2f7;
  border-radius: 10px;
}
.info-cell span {
  display: block;
  font-size: 11px;
  color: #64748b;
  margin-bottom: 3px;
}
.info-cell strong {
  font-size: 14px;
  color: #0f172a;
}
.location-row {
  padding: 10px 12px;
  background: #f1f5f9;
  border-radius: 10px;
  font-size: 12.5px;
  color: #334155;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.location-row b {
  color: #0f2d44;
  flex-shrink: 0;
}

/* 해당 단지의 8P 카탈로그 직통 열기 버튼 */
.btn-open-catalog {
  display: block;
  width: 100%;
  padding: 15px 0;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #0b2238 0%, #164363 100%);
  color: #f3d999;
  font-size: 15px;
  font-weight: 900;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(11,34,56,0.2);
  transition: transform 0.15s;
}
.btn-open-catalog:active {
  transform: scale(0.98);
}

.no-match-box {
  padding: 40px 18px;
  background: #fff;
  border-radius: 16px;
  border: 1px dashed #cbd5e1;
  text-align: center;
  color: #64748b;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="matcher-container">

  <header class="matcher-header">
    <span class="eyebrow">PREMIUM MATCHING</span>
    <h1>아파트분양 맞춤 매칭기</h1>
    <p>원하시는 시·도 및 시·군·구를 선택하시면<br>해당 지역의 전체 분양 아파트 목록이 실시간으로 매칭됩니다.</p>
  </header>

  <!-- 3단계 지역 선택 박스 -->
  <section class="selector-card">
    <div class="selector-title">
      <span>📍 매칭 희망 지역 선택</span>
      <span id="resetBtn" style="color:#0284c7; cursor:pointer; font-size:12px;">전체 초기화 ↺</span>
    </div>
    <div class="select-row">
      <select id="sidoSelect" class="select-box">
        <option value="">시·도 전체</option>
      </select>
      <select id="gugunSelect" class="select-box" disabled>
        <option value="">시·군·구 전체</option>
      </select>
      <select id="dongSelect" class="select-box" disabled>
        <option value="">읍·면·동 전체</option>
      </select>
    </div>
  </section>

  <!-- 매칭 결과 헤더 -->
  <div class="result-badge-bar">
    <span class="result-badge" id="matchBadge">🏢 매칭 분양 단지 리스트</span>
    <span class="result-count" id="matchStatusText">총 148개 단지</span>
  </div>

  <!-- 전체 단지가 전부 노출되는 리스트 컨테이너 -->
  <section class="matched-list" id="matchedCardContainer"></section>

</div>

<script>
(function() {
  var presaleList = [];
  var sidoSelect = document.getElementById("sidoSelect");
  var gugunSelect = document.getElementById("gugunSelect");
  var dongSelect = document.getElementById("dongSelect");
  var cardContainer = document.getElementById("matchedCardContainer");
  var matchStatusText = document.getElementById("matchStatusText");
  var resetBtn = document.getElementById("resetBtn");

  fetch("presale_db.json")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      presaleList = Array.isArray(data) ? data : [];
      initSidoOptions();
      // 처음에는 '전체 148개'를 시원하게 전부 보여줌!
      renderList(presaleList);
    })
    .catch(function(e) {
      console.log("DB Load Error", e);
    });

  function initSidoOptions() {
    var sidos = [];
    presaleList.forEach(function(item) {
      if (item.sido && sidos.indexOf(item.sido) === -1) {
        sidos.push(item.sido);
      }
    });
    sidos.sort();
    sidoSelect.innerHTML = '<option value="">시·도 전체</option>' + sidos.map(function(s) {
      return '<option value="' + s + '">' + s + '</option>';
    }).join("");
  }

  sidoSelect.addEventListener("change", function() {
    var selectedSido = sidoSelect.value;
    gugunSelect.innerHTML = '<option value="">시·군·구 전체</option>';
    dongSelect.innerHTML = '<option value="">읍·면·동 전체</option>';
    dongSelect.disabled = true;

    if (!selectedSido) {
      gugunSelect.disabled = true;
      renderList(presaleList);
      return;
    }

    var guguns = [];
    presaleList.forEach(function(item) {
      if (item.sido === selectedSido && item.gugun && guguns.indexOf(item.gugun) === -1) {
        guguns.push(item.gugun);
      }
    });
    guguns.sort();

    gugunSelect.innerHTML = '<option value="">시·군·구 전체</option>' + guguns.map(function(g) {
      return '<option value="' + g + '">' + g + '</option>';
    }).join("");
    gugunSelect.disabled = false;

    filterAndRender();
  });

  gugunSelect.addEventListener("change", function() {
    var selectedSido = sidoSelect.value;
    var selectedGugun = gugunSelect.value;
    dongSelect.innerHTML = '<option value="">읍·면·동 전체</option>';

    if (!selectedGugun) {
      dongSelect.disabled = true;
      filterAndRender();
      return;
    }

    var dongs = [];
    presaleList.forEach(function(item) {
      if (item.sido === selectedSido && item.gugun === selectedGugun && item.dong && dongs.indexOf(item.dong) === -1) {
        dongs.push(item.dong);
      }
    });
    dongs.sort();

    if (dongs.length > 0) {
      dongSelect.innerHTML = '<option value="">읍·면·동 전체</option>' + dongs.map(function(d) {
        return '<option value="' + d + '">' + d + '</option>';
      }).join("");
      dongSelect.disabled = false;
    } else {
      dongSelect.disabled = true;
    }

    filterAndRender();
  });

  dongSelect.addEventListener("change", function() {
    filterAndRender();
  });

  if (resetBtn) {
    resetBtn.addEventListener("click", function() {
      sidoSelect.value = "";
      gugunSelect.innerHTML = '<option value="">시·군·구 전체</option>';
      gugunSelect.disabled = true;
      dongSelect.innerHTML = '<option value="">읍·면·동 전체</option>';
      dongSelect.disabled = true;
      renderList(presaleList);
    });
  }

  function filterAndRender() {
    var sido = sidoSelect.value;
    var gugun = gugunSelect.value;
    var dong = dongSelect.value;

    var filtered = presaleList.filter(function(item) {
      var matchSido = !sido || item.sido === sido;
      var matchGugun = !gugun || item.gugun === gugun;
      var matchDong = !dong || item.dong === dong;
      return matchSido && matchGugun && matchDong;
    });

    renderList(filtered);
  }

  function renderList(list) {
    if (!list || list.length === 0) {
      matchStatusText.textContent = "검색 결과 0건";
      cardContainer.innerHTML = `
        <div class="no-match-box">
          현재 선택하신 지역에 등록된 분양 단지가 없습니다.<br>다른 지역을 선택해 주세요.
        </div>
      `;
      return;
    }

    var regionName = sidoSelect.value ? (sidoSelect.value + (gugunSelect.value ? " " + gugunSelect.value : "")) : "전국";
    matchStatusText.textContent = regionName + " " + list.length + "개 단지 매칭";

    cardContainer.innerHTML = list.map(function(item) {
      // 8P 카탈로그 직통 열기 주소
      var directCatalogUrl = "sale-detail.html?apt=" + encodeURIComponent(item.apt_name || '') + 
                             "&sido=" + encodeURIComponent(item.sido || '') + 
                             "&phone=" + encodeURIComponent(item.director_phone || '');

      return `
        <article class="matched-card">
          <div class="card-hero" style="background-image:url('sample-cover.jpg');">
            <div class="hero-shade"></div>
            <div class="card-top-badges">
              <span class="badge-status">${item.status || '분양중'}</span>
              <span class="badge-builder">${item.builder || '공식 시공사'}</span>
            </div>
            <div class="card-hero-body">
              <small>${item.sido || ''} ${item.gugun || ''} ${item.dong || ''}</small>
              <h2>${item.apt_name || '프리미엄 분양 단지'}</h2>
              <p>최고의 입지와 브랜드 프리미엄을 갖춘 랜드마크</p>
            </div>
          </div>

          <div class="card-details">
            <div class="info-table">
              <div class="info-cell">
                <span>총 세대수</span>
                <strong>${item.units || '대단지'}</strong>
              </div>
              <div class="info-cell">
                <span>시공사</span>
                <strong>${item.builder || '책임시공'}</strong>
              </div>
            </div>

            <div class="location-row">
              <b>현장 위치</b>
              <span>${item.address || (item.sido + ' ' + item.gugun)}</span>
            </div>

            <a href="${directCatalogUrl}" class="btn-open-catalog">
              📖 [${item.apt_name}] 8P 공식 카탈로그 열기
            </a>
          </div>
        </article>
      `;
    }).join("");
  }

})();
</script>

</body>
</html>
